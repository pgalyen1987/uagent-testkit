[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uagent-testkit"
version = "0.1.0"
description = "Test Fetch.ai uAgents without a network, a wallet, or a sleep()."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["fetchai", "uagents", "agentverse", "testing", "pytest", "asi"]
authors = [{ name = "pgalyen1987", email = "pgalyen87@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "uagents>=0.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # exercised by the ChainDouble tests, which drive real HTTP clients
    "requests>=2.31",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/pgalyen1987/uagent-testkit"
Repository = "https://github.com/pgalyen1987/uagent-testkit"
Issues = "https://github.com/pgalyen1987/uagent-testkit/issues"

[project.entry-points.pytest11]
uagent_testkit = "uagent_testkit.plugin"

[tool.hatch.build.targets.wheel]
packages = ["uagent_testkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples"]
